:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);

        const text = String(value)
          .trim()
          .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xfee0))
          .replace(/[，,]/g, "")
          .replace(/^=/, "");
        if (!text || /[A-DF-Za-df-zぁ-んァ-ン一-龥]/.test(text.replace(/[Ee][+-]?\d+$/, ""))) return NaN;
        const n = Number(text);
        return Number.isFinite(n) ? n : NaN;
      };
      const inferDilution = name => {
        const text = String(name || "");
        const match = text.match(/10\s*(?:\^|e|E|-)\s*-?(\d+)/);
        if (!match) return 1;
        return 10 ** Math.min(8, Math.max(2, Number(match[1]) + 1));
      };
      const sampleGroup = name => {
        const base = String(name || "")
          .replace(/\s*10\s*(?:\^|e|E|-)\s*-?\d+\s*$/i, "")
          .trim();
        return base || "sample";
      };
      const fmtSci = value => {
        if (!Number.isFinite(value) || value <= 0) return "-";
        const exp = Math.round(Math.log10(value));
        if (Math.abs(value - 10 ** exp) / value < 1e-9) return `1E+${exp}`;
        return value.toExponential(1).replace("e+", "E+");
      };
      const fmtTiter = value => Number.isFinite(value) && value > 0 ? value.toExponential(2).replace("e+", "E+") : "-";
      const dilutionSelect = row => {
        const select = document.createElement("select");
        for (let exp = 2; exp <= 8; exp++) {
          const option = document.createElement("option");
          option.value = String(10 ** exp);
          option.textContent = `1E+${exp}`;
          select.append(option);
        }
        select.value = String(row.dilution);
        select.addEventListener("change", () => {
          row.dilution = Number(select.value);
          row.dilutionTouched = true;
          update();
        });
        return select;
      };
      const applyFixedDilutions = rows => {
        const seen = new Map();
        rows.forEach(row => {
          row.group = sampleGroup(row.name);
          const index = seen.get(row.group) || 0;
          seen.set(row.group, index + 1);
          if (!row.dilutionTouched) {
            const fromName = inferDilution(row.name);
            row.dilution = fromName > 1 ? fromName : 10 ** Math.min(8, 2 + index);
          }
          if (row.include === undefined) row.include = true;
        });
      };
      const parsePastedRows = text => {
        const parsedStd = [];
        const parsedUnknowns = [];
        let parsedNtc = NaN;
        const rows = text.split(/\r?\n/).map(row => row.split("\t").map(cell => cell.trim()));
        const findCol = (headerCells, aliases) => {
          for (const alias of aliases) {
            const i = headerCells.indexOf(alias);
            if (i >= 0) return i;
          }
          return -1;
        };
        const headerRow = rows.find(cells =>
          cells.some(cell => /^well$/i.test(cell)) &&
          cells.some(cell => /^(content|task)$/i.test(cell))
        );
        const headers = headerRow ? headerRow.map(cell => cell.trim().toLowerCase()) : [];
        const idx = {
          content: findCol(headers, ["content", "task"]),
          well: findCol(headers, ["well"]),
          sample: findCol(headers, ["sample", "sample name"]),
          cq: findCol(headers, ["cq", "ct", "cт"]),
          sq: findCol(headers, ["sq", "quantity", "starting quantity"])
        };
        let stdAutoLog = 10;
        let usedPlaceholderLog = false;
        rows.forEach(cells => {
          if (!cells.some(Boolean)) return;
          if (cells === headerRow) return;
          if (idx.content >= 0 && idx.cq >= 0) {
            const content = (cells[idx.content] || "").toLowerCase();
            const cq = parseNumber(cells[idx.cq]);
            const sq = idx.sq >= 0 ? parseNumber(cells[idx.sq]) : NaN;
            if ((content === "std" || content === "standard") && Number.isFinite(cq)) {
              if (Number.isFinite(sq) && sq > 0) {
                parsedStd.push({ use: true, copy: sq, log: Math.log10(sq), ct: cq });
              } else {
                const log = stdAutoLog--;
                usedPlaceholderLog = true;
                parsedStd.push({ use: true, copy: 10 ** log, log, ct: cq });
              }
              return;
            }
            if (content === "ntc") {
              if (Number.isFinite(cq)) parsedNtc = cq;
              return;
            }
            if ((content === "unkn" || content === "unknown") && Number.isFinite(cq)) {
              const name = (idx.sample >= 0 && cells[idx.sample]) ? cells[idx.sample] : `sample ${parsedUnknowns.length + 1}`;
              parsedUnknowns.push({
                include: true,
                well: idx.well >= 0 ? cells[idx.well] : "",
                name,
                ct: cq,
                dilution: inferDilution(name)
              });
              return;
            }
          }
          const lower = cells.map(cell => cell.toLowerCase());
          const typeIndex = lower.findIndex(cell => ["std", "ntc", "unkn", "unknown"].includes(cell));
          const numbers = cells.map(parseNumber);
          if (typeIndex >= 0 && lower[typeIndex] === "std") {
            const after = numbers.slice(typeIndex + 1).filter(Number.isFinite);
            let copy = after.find(value => value > 100);
            let log = after.find(value => value >= 0 && value <= 20 && value !== copy);
            let ct = after.find(value => value > 5 && value < 60 && value !== log && value !== copy);
            if (!Number.isFinite(copy) && Number.isFinite(log)) copy = 10 ** log;
            if (!Number.isFinite(log) && Number.isFinite(copy) && copy > 0) log = Math.log10(copy);
            if (Number.isFinite(copy) && Number.isFinite(log) && Number.isFinite(ct)) {
              parsedStd.push({ use: true, copy, log, ct });
            }
            return;
          }
          if (typeIndex >= 0 && lower[typeIndex] === "ntc") {
            const after = numbers.slice(typeIndex + 1).filter(value => Number.isFinite(value) && value > 5 && value < 60);
            if (after.length) parsedNtc = after[after.length - 1];
            return;
          }
          if (typeIndex >= 0 && (lower[typeIndex] === "unkn" || lower[typeIndex] === "unknown")) {
            const sampleCells = cells.slice(typeIndex + 1).filter(cell => cell && !Number.isFinite(parseNumber(cell)) && !cell.startsWith("="));
            const name = sampleCells[0] || `sample ${parsedUnknowns.length + 1}`;
            const after = numbers.slice(typeIndex + 1).filter(value => Number.isFinite(value) && value > 0);
            const ct = after.find(value => value > 5 && value < 60);
            if (Number.isFinite(ct)) {
              parsedUnknowns.push({
                include: true,
                well: cells[0] || "",
                name,
                ct,
                dilution: inferDilution(name)
              });
            }
            return;
          }
          const finite = numbers.filter(Number.isFinite);
          if (finite.length === 2 && finite[0] >= 0 && finite[0] <= 20 && finite[1] > 5 && finite[1] < 60) {
            parsedStd.push({ use: true, copy: 10 ** finite[0], log: finite[0], ct: finite[1] });
          }
        });
        return { parsedStd, parsedUnknowns, parsedNtc, usedPlaceholderLog };
      };
      const applyPaste = () => {
        const text = root.querySelector("#paste-box").value;
        const { parsedStd, parsedUnknowns, parsedNtc, usedPlaceholderLog } = parsePastedRows(text);
        if (!parsedStd.length && !parsedUnknowns.length && !Number.isFinite(parsedNtc)) {
          root.querySelector("#paste-status").textContent = "認識できるStd/Unkn/NTC行がありません";
          return;
        }
        applyFixedDilutions(parsedUnknowns);
        if (parsedStd.length) std = parsedStd;
        if (parsedUnknowns.length) unknowns = parsedUnknowns;
        if (Number.isFinite(parsedNtc)) ntcCt = parsedNtc;
        renderStd();
        update();
        const note = usedPlaceholderLog ? "(STDにcopy数の列が無かったため、copy/logは仮の値です。標準系列の表で実際の値に修正してください)" : "";
        root.querySelector("#paste-status").textContent = `Std ${parsedStd.length || std.length}点、未知 ${parsedUnknowns.length || unknowns.length}行、NTC ${Number.isFinite(ntcCt) ? fmt(ntcCt, 5) : "-"} を反映 ${note}`;
      };
      const numberInput = (value, onChange, step = "any") => {
        const input = document.createElement("input");
        input.type = "number";
        input.step = step;
        input.value = value;
        input.addEventListener("input", () => onChange(Number(input.value)));
        return input;
      };
      const textNumberInput = (value, onChange) => {
        const input = document.createElement("input");
        input.type = "text";
        input.inputMode = "decimal";
        input.value = Number.isFinite(value) ? String(value) : "";
        input.addEventListener("change", () => onChange(parseNumber(input.value)));
        return input;
      };
      const renderStd = () => {
        stdBody.replaceChildren();
        std.forEach((row) => {
          const tr = document.createElement("tr");
          const useTd = document.createElement("td");
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = row.use;
          cb.addEventListener("change", () => {
            row.use = cb.checked;
            update();
          });
          useTd.append(cb);
          const copyTd = document.createElement("td");
          copyTd.append(numberInput(row.copy, value => {
            row.copy = value;
            row.log = Math.log10(value);
            update();
          }));
          const logTd = document.createElement("td");
          logTd.append(numberInput(row.log, value => {
            row.log = value;
            row.copy = 10 ** value;
            update();
          }));
          const ctTd = document.createElement("td");
          ctTd.append(numberInput(row.ct, value => {
            row.ct = value;
            update();
          }));
          tr.append(useTd, copyTd, logTd, ctTd);
          stdBody.append(tr);
        });
      };
      const captureFocus = (container) => {
        const active = document.activeElement;
        if (!active || !container.contains(active)) return null;
        const tr = active.closest("tr");
        if (!tr || !tr.parentElement) return null;
        const td = active.closest("td");
        return {
          rowIndex: Array.prototype.indexOf.call(tr.parentElement.children, tr),
          cellIndex: td ? Array.prototype.indexOf.call(tr.children, td) : -1,
          selectionStart: typeof active.selectionStart === "number" ? active.selectionStart : null,
          selectionEnd: typeof active.selectionEnd === "number" ? active.selectionEnd : null
        };
      };
      const restoreFocus = (container, saved) => {
        if (!saved) return;
        const tr = container.children[saved.rowIndex];
        const td = tr && saved.cellIndex >= 0 ? tr.children[saved.cellIndex] : null;
        const field = td ? td.querySelector("input, select") : null;
        if (!field) return;
        field.focus();
        if (saved.selectionStart != null && typeof field.setSelectionRange === "function") {
          try {
            field.setSelectionRange(saved.selectionStart, saved.selectionEnd);
          } catch (err) {
            /* not a text-selectable input (e.g. number) */
          }
        }
      };
      const renderUnknowns = (fit) => {
        const savedFocus = captureFocus(unkBody);
        unkBody.replaceChildren();
        avgBody.replaceChildren();
        applyFixedDilutions(unknowns);
        const groups = new Map();
        const xs = std.filter(d => d.use).map(d => d.log);
        const minStdLog = Math.min(...xs);
        const maxStdLog = Math.max(...xs);
        unknowns.forEach((row) => {
          const tr = document.createElement("tr");
          const includeTd = document.createElement("td");
          const include = document.createElement("input");
          include.type = "checkbox";
          include.checked = row.include !== false;
          include.addEventListener("change", () => {
            row.include = include.checked;
            update();
          });
          includeTd.append(include);
          const wellTd = document.createElement("td");
          wellTd.textContent = row.well || "";
          const nameTd = document.createElement("td");
          const name = document.createElement("input");
          name.type = "text";
          name.value = row.name;
          name.addEventListener("input", () => {
            row.name = name.value;
            row.group = sampleGroup(row.name);
            if (!row.dilutionTouched) {
              row.dilution = inferDilution(row.name);
              if (row.dilution <= 1) row.dilution = 10 ** 2;
            }
            update();
          });
          nameTd.append(name);
          const dilutionTd = document.createElement("td");
          dilutionTd.append(dilutionSelect(row));
          const ctTd = document.createElement("td");
          ctTd.append(numberInput(row.ct, value => {
            row.ct = value;
            update();
          }));
          let logCopy = NaN;
          let copy = NaN;
          let titer = NaN;
          if (fit) {
            logCopy = (row.ct - fit.intercept) / fit.slope;
            copy = 10 ** logCopy;
            titer = copy * row.dilution;
          }
          const isOut = Number.isFinite(logCopy) && (logCopy < minStdLog || logCopy > maxStdLog);
          if (isOut) {
            tr.className = "bad-row";
          }
          if (!groups.has(row.group)) groups.set(row.group, { titers: [], out: 0 });
          const group = groups.get(row.group);
          if (isOut) group.out += 1;
          if (!isOut && row.include !== false && Number.isFinite(titer)) {
            group.titers.push(titer);
          }
          const copyTd = document.createElement("td");
          copyTd.textContent = fmtTiter(copy);
          const titerTd = document.createElement("td");
          titerTd.textContent = fmtTiter(titer);
          tr.append(includeTd, wellTd, nameTd, ctTd, dilutionTd, copyTd, titerTd);
          unkBody.append(tr);
        });
        groups.forEach((data, groupName) => {
          if (!groupSettings.has(groupName)) groupSettings.set(groupName, { comment: "", lot: "", volume: 1, dishes: 1 });
          const settings = groupSettings.get(groupName);
          const tr = document.createElement("tr");
          const nameTd = document.createElement("td");
          nameTd.textContent = groupName;
          const commentTd = document.createElement("td");
          const comment = document.createElement("input");
          comment.type = "text";
          comment.value = settings.comment;
          comment.addEventListener("input", () => {
            settings.comment = comment.value;
          });
          commentTd.append(comment);
          const lotTd = document.createElement("td");
          const lot = document.createElement("input");
          lot.type = "text";
          lot.value = settings.lot;
          lot.addEventListener("input", () => {
            settings.lot = lot.value;
          });
          lotTd.append(lot);
          const meanTd = document.createElement("td");
          const groupMean = data.titers.length ? data.titers.reduce((a, b) => a + b, 0) / data.titers.length : NaN;
          meanTd.textContent = fmtTiter(groupMean);
          const volumeTd = document.createElement("td");
          volumeTd.append(textNumberInput(settings.volume, value => {
            settings.volume = value;
            update();
          }));
          const dishTd = document.createElement("td");
          dishTd.append(textNumberInput(settings.dishes, value => {
            settings.dishes = value;
            update();
          }));
          const gcDishTd = document.createElement("td");
          gcDishTd.textContent = settings.dishes > 0 ? fmtTiter(groupMean * settings.volume / settings.dishes) : "-";
          tr.append(nameTd, commentTd, lotTd, meanTd, volumeTd, dishTd, gcDishTd);
          avgBody.append(tr);
        });
        restoreFocus(unkBody, savedFocus);
      };
      const drawChart = (fit) => {
        chart.replaceChildren();
        const width = chart.clientWidth || 620;
        const height = chart.clientHeight || 250;
        chart.setAttribute("viewBox", `0 0 ${width} ${height}`);
        const m = { top: 18, right: 22, bottom: 46, left: 56 };
        const innerW = width - m.left - m.right;
        const innerH = height - m.top - m.bottom;
        const allX = std.map(d => d.log).filter(Number.isFinite);
        const allY = std.map(d => d.ct).filter(Number.isFinite);
        if (Number.isFinite(ntcCt)) allY.push(ntcCt);
        const minX = Math.floor(Math.min(...allX) - 0.5);
        const maxX = Math.ceil(Math.max(...allX) + 0.5);
        const minY = Math.max(0, Math.floor(Math.min(...allY) - 3));
        const maxY = Math.ceil(Math.max(...allY) + 3);
        const x = value => m.left + ((value - minX) / (maxX - minX)) * innerW;
        const y = value => m.top + innerH - ((value - minY) / (maxY - minY)) * innerH;
        const make = (name, attrs = {}) => {
          const el = document.createElementNS("http://www.w3.org/2000/svg", name);
          Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
          chart.append(el);
          return el;
        };
        for (let xv = Math.ceil(minX); xv <= Math.floor(maxX); xv++) {
          make("line", { x1: x(xv), y1: m.top, x2: x(xv), y2: m.top + innerH, class: "grid" });
          const tx = make("text", { x: x(xv), y: height - 24, "text-anchor": "middle", class: "axis" });
          tx.textContent = xv;
        }
        for (let yv = Math.ceil(minY / 5) * 5; yv <= maxY; yv += 5) {
          make("line", { x1: m.left, y1: y(yv), x2: m.left + innerW, y2: y(yv), class: "grid" });
          const ty = make("text", { x: m.left - 8, y: y(yv) + 4, "text-anchor": "end", class: "axis" });
          ty.textContent = yv;
        }
        make("rect", { x: m.left, y: m.top, width: innerW, height: innerH, fill: "none", class: "frame" });
        const xt = make("text", { x: m.left + innerW / 2, y: height - 4, "text-anchor": "middle", class: "axis-title" });
        xt.textContent = "log10(copy number)";
        const yt = make("text", { x: 16, y: m.top + innerH / 2, transform: `rotate(-90 16 ${m.top + innerH / 2})`, "text-anchor": "middle", class: "axis-title" });
        yt.textContent = "Ct";
        if (fit) {
          const x1 = minX;
          const x2 = maxX;
          const y1 = fit.slope * x1 + fit.intercept;
          const y2 = fit.slope * x2 + fit.intercept;
          make("line", { x1: x(x1), y1: y(y1), x2: x(x2), y2: y(y2), class: "fit-line" });
        }
        if (Number.isFinite(ntcCt)) {
          make("line", { x1: m.left, y1: y(ntcCt), x2: m.left + innerW, y2: y(ntcCt), class: "ntc-line" });
          const label = make("text", { x: m.left + innerW - 4, y: y(ntcCt) - 6, "text-anchor": "end", class: "point-label" });
          label.textContent = `NTC Ct ${fmt(ntcCt, 4)}`;
        }
        std.forEach((d) => {
          make("circle", { cx: x(d.log), cy: y(d.ct), r: 5, class: d.use ? "std-point" : "excluded" });
        });
        if (fit) {
          const size = 8;
          unknowns.forEach((row) => {
            if (row.include === false) return;
            if (!Number.isFinite(row.ct)) return;
            const logCopy = (row.ct - fit.intercept) / fit.slope;
            if (!Number.isFinite(logCopy)) return;
            make("rect", {
              x: x(logCopy) - size / 2,
              y: y(row.ct) - size / 2,
              width: size,
              height: size,
              class: "unk-point"
            });
          });
        }
      };
      const update = () => {
        const fit = regression(std);
        root.querySelector("#slope").textContent = fit ? fit.slope.toFixed(4) : "-";
        root.querySelector("#intercept").textContent = fit ? fit.intercept.toFixed(3) : "-";
        root.querySelector("#r2").textContent = fit ? fit.r2.toFixed(4) : "-";
        root.querySelector("#efficiency").textContent = fit ? `${fit.efficiency.toFixed(1)}%` : "-";
        root.querySelector("#ntc-note").textContent = `NTC Ct: ${fmt(ntcCt, 5)} / 検量線には含めない`;
        renderUnknowns(fit);
        drawChart(fit);
      };
      root.querySelector("#print-page").addEventListener("click", () => window.print());
      root.querySelector("#copy-summary").addEventListener("click", async () => {
        const header = ["sample", "comment", "lot", "titer(gc/ul)", "total(ul)", "dish", "gc/dish"];
        const rows = [header.join("\t")];
        avgBody.querySelectorAll("tr").forEach(tr => {
          const cells = Array.from(tr.children).map(td => {
            const field = td.querySelector("input, select");
            if (field) return field.value;
            return td.textContent;
          });
          rows.push(cells.join("\t"));
        });
        const text = rows.join("\n");
        const status = root.querySelector("#copy-status");
        let ok = false;
        if (window.isSecureContext && navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            ok = true;
          } catch (err) {
            ok = false;
          }
        }
        if (!ok) {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.top = "-1000px";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          try {
            ok = document.execCommand("copy");
          } catch (err) {
            ok = false;
          }
          document.body.removeChild(textarea);
        }
        const fallback = root.querySelector("#copy-fallback");
        if (ok) {
          status.textContent = "集計をクリップボードにコピーしました";
          fallback.hidden = true;
        } else {
          status.textContent = "自動コピーできませんでした。下の欄が選択済みなのでそのままコピーしてください";
          fallback.value = text;
          fallback.hidden = false;
          fallback.focus();
          fallback.select();
        }
      });
      root.querySelector("#apply-paste").addEventListener("click", applyPaste);
      root.querySelector("#clear-paste").addEventListener("click", () => {
        root.querySelector("#paste-box").value = "";
        root.querySelector("#paste-status").textContent = "";
      });
      root.querySelector("#load-example").addEventListener("click", () => {
        root.querySelector("#paste-box").value = [
          "Well\tFluor\tTarget\tContent\tSample\tCq\tSQ",
          "A01\tSYBR\t\tStd\t\t12.87\t10000000000.00000",
          "A02\tSYBR\t\tStd\t\t12.06\t1000000000.00000",
          "A03\tSYBR\t\tStd\t\t14.01\t100000000.00000",
          "A04\tSYBR\t\tStd\t\t17.62\t10000000.00000",
          "A05\tSYBR\t\tStd\t\t20.57\t1000000.00000",
          "A06\tSYBR\t\tStd\t\t24.37\t100000.00000",
          "A07\tSYBR\t\tStd\t\t28.58\t10000.00000",
          "A08\tSYBR\t\tStd\t\t28.00\t1000.00000",
          "A09\tSYBR\t\tNTC\t\t27.65\t",
          "B01\tSYBR\t\tUnkn\tAAV 10e-1\t12.82\t",
          "B02\tSYBR\t\tUnkn\tAAV 10e-2\t16.43\t",
          "B03\tSYBR\t\tUnkn\tAAV 10e-3\t20.30\t"
        ].join("\n");
        applyPaste();
      });
      root.querySelector("#sort-asc").addEventListener("click", () => {
        std.sort((a, b) => a.log - b.log);
        renderStd();
        update();
      });
      root.querySelector("#sort-desc").addEventListener("click", () => {
        std.sort((a, b) => b.log - a.log);
        renderStd();
        update();
      });
      const ro = new ResizeObserver(update);
      ro.observe(chart);
      renderStd();
      update();
    })();
  </script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
