  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;

}

    (() =&gt; {
      const root = document.getElementById(&quot;qpcr-calculator&quot;);
      const stdBody = root.querySelector(&quot;#std-body&quot;);
      const unkBody = root.querySelector(&quot;#unk-body&quot;);

      const fmt = (value, digits = 3) =&gt; Number.isFinite(value) ? value.toLocaleString(&quot;en-US&quot;, { maximumSignificantDigits: digits }) : &quot;-&quot;;
      let ntcCt = 27.6460654753957;
      let std = [
        { use: true, copy: 1e10, log: 10, ct: 12.8742979264328 },
        { use: true, copy: 1e9, log: 9, ct: 12.0554830552965 },
        { use: true, copy: 1e8, log: 8, ct: 14.0093492695434 },

        { use: true, copy: 1e6, log: 6, ct: 20.5664427327878 },
        { use: true, copy: 1e5, log: 5, ct: 24.3668972271087 },
        { use: true, copy: 1e4, log: 4, ct: 28.5776032808391 },
        { use: true, copy: 1e3, log: 3, ct: 28.0046569667665 }
      ];
      let unknowns = [
        { include: true, well: &quot;B01&quot;, name: &quot;postD 10e-1&quot;, ct: 12.82, dilution: 100 },
        { include: true, well: &quot;B02&quot;, name: &quot;postD 10e-2&quot;, ct: 16.43, dilution: 1000 },
        { include: true, well: &quot;B03&quot;, name: &quot;postD 10e-3&quot;, ct: 20.30, dilution: 10000 },
        { include: true, well: &quot;B04&quot;, name: &quot;postD 10e-4&quot;, ct: 24.11, dilution: 100000 },
        { include: true, well: &quot;B05&quot;, name: &quot;postD 10e-5&quot;, ct: 27.28, dilution: 1000000 },
        { include: false, well: &quot;B06&quot;, name: &quot;postD 10e-6&quot;, ct: 28.04, dilution: 10000000 },
        { include: false, well: &quot;B07&quot;, name: &quot;postD 10e-7&quot;, ct: 27.40, dilution: 100000000 }
      ];
      const groupSettings = new Map();
      const regression = rows =&gt; {
        const pts = rows.filter(d =&gt; d.use &amp;&amp; Number.isFinite(d.log) &amp;&amp; Number.isFinite(d.ct));
        const n = pts.length;
        if (n &lt; 2) return null;
        const sx = pts.reduce((a, d) =&gt; a + d.log, 0);
        const sy = pts.reduce((a, d) =&gt; a + d.ct, 0);
        const sxy = pts.reduce((a, d) =&gt; a + d.log * d.ct, 0);
        const sx2 = pts.reduce((a, d) =&gt; a + d.log * d.log, 0);
        const slope = (n * sxy - sx * sy) / (n * sx2 - sx * sx);
        const intercept = (sy - slope * sx) / n;
        const meanY = sy / n;
